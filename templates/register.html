{% extends 'base.html' %}
{% block content %}
<div class="auth-box">
    <h2>{% if request.args.get('role') == 'Seller' %}Start Selling on Paira{% else %}Create Account{% endif %}</h2>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="POST">
        <input type="text"     name="name"     placeholder="Full Name" required><br>
        <input type="email"    name="email"    placeholder="Email"     required><br>
        <input type="password" name="password" placeholder="Password"  required><br>
        <select name="role" required>
            <option value="">-- Register as --</option>
            <option value="Customer" {% if request.args.get('role') != 'Seller' %}selected{% endif %}>Customer</option>
            <option value="Seller"   {% if request.args.get('role') == 'Seller' %}selected{% endif %}>Seller</option>
        </select><br>
        <button type="submit">Create Account</button>
    </form>
    <p>Already have an account? <a href="/login" class="link">Login</a></p>
</div>
{% endblock %}
